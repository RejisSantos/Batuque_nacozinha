<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel ADM | Batuque na Cozinha</title><link rel="stylesheet" href="styles.css">
<script type="module" src="painel.mjs"></script></head>
<body><main class="shell admin-page">
<a href="index.html">← Voltar ao site</a>
<h1>Painel do Batuque</h1><p id="status" role="status">Conectando…</p>
<form class="admin-form" id="login" hidden>
<label>E-mail<input name="email" type="email" required autocomplete="username"></label>
<label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
<div class="actions"><button class="btn dark">Entrar</button><button class="btn menu-outline" type="button" id="reset">Definir ou recuperar senha</button></div>
</form>
<div class="actions"><button class="btn dark" type="button" id="verify" hidden>Enviar verificação de e-mail</button><button class="btn menu-outline" type="button" id="logout" hidden>Sair</button></div>
<div id="editor" hidden>
<p>Salve as edições na lista e clique em Publicar para atualizar o site.</p>
<label>Editar <select id="view"><option value="menu">Cardápio e preços</option><option value="events">Divulgações e eventos</option><option value="hours">Horários</option></select></label>
<form class="admin-form" id="records">
<label>Publicação ou item<select id="record"></select></label>
<label id="category-field">Categoria<select name="category"></select></label>
<label>Título<input name="title" maxlength="100" required></label>
<label id="date-field">Data<input name="date" type="date"></label>
<label id="price-field">Preço<input name="price" maxlength="42" placeholder="R$ 25,00"></label>
<label>Descrição ou legenda<textarea name="description" rows="3" maxlength="500"></textarea></label>
<label>Foto<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
<img class="admin-preview" id="photo" alt="Prévia da imagem" hidden>
<div class="actions"><button class="btn dark" id="save-record">Salvar na lista</button><button type="button" class="btn menu-outline" id="remove-record">Remover da lista</button></div>
</form>
<form class="admin-form" id="hours" hidden>
<label>Almoço<input name="lunch" maxlength="90" required></label>
<label>Noite<input name="evening" maxlength="90" required></label>
<button class="btn dark">Salvar horários</button>
</form>
<div class="actions"><button class="btn primary" type="button" id="publish" disabled>Publicar alterações</button></div>
</div>
</main></body></html>
